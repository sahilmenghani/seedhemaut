<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Seedhe Maut</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --glass: rgba(20, 20, 20, 0.48);
        --glass-light: rgba(255, 255, 255, 0.1);
        --border: rgba(255, 255, 255, 0.18);
        --text: #ffffff;
        --muted: #a9a9a9;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
        background: #000;
      }

      /* =========================
   BACKGROUND
========================= */

      .background {
        position: fixed;
        inset: 0;

        background:
          linear-gradient(to bottom, rgba(0, 0, 0, 0.08), rgba(0, 0, 0, 0.42)),
          url("background.jpg") center center / cover no-repeat;

        filter: grayscale(100%);
        transform: scale(1.02);

        z-index: -3;
      }

      .background::after {
        content: "";
        position: absolute;
        inset: 0;

        background: radial-gradient(
          circle at center,
          transparent 20%,
          rgba(0, 0, 0, 0.5) 100%
        );
      }

      /* =========================
   TOP BROWSER BAR
========================= */

      .browser {
        height: 58px;
        width: 100%;

        display: flex;
        align-items: center;

        padding: 0 22px;

        background: rgba(0, 0, 0, 0.78);

        border-bottom: 1px solid rgba(255, 255, 255, 0.08);

        position: relative;
        z-index: 10;
      }

      .browser-left {
        display: flex;
        align-items: center;
        gap: 25px;
        font-size: 22px;
      }

      .browser-left span {
        opacity: 0.85;
      }

      .address {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);

        width: 480px;
        height: 38px;

        border-radius: 20px;

        display: flex;
        align-items: center;
        justify-content: center;

        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.14);

        color: #ddd;
        font-size: 14px;

        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }

      .browser-right {
        margin-left: auto;

        display: flex;
        align-items: center;
        gap: 28px;

        font-size: 18px;
      }

      /* =========================
   MUSIC PLAYER
========================= */

      .player {
        position: absolute;

        left: 50%;
        top: 53%;

        transform: translate(-50%, -50%);

        width: min(1000px, 72vw);
        height: 92px;

        padding: 0 28px;

        display: flex;
        align-items: center;
        gap: 22px;

        background: var(--glass);

        border: 1px solid var(--border);

        border-radius: 28px;

        box-shadow:
          0 20px 60px rgba(0, 0, 0, 0.35),
          inset 0 1px rgba(255, 255, 255, 0.15);

        backdrop-filter: blur(28px) saturate(150%);
        -webkit-backdrop-filter: blur(28px) saturate(150%);

        z-index: 5;
      }

      /* PLAYER BUTTONS */

      .control {
        width: 56px;
        height: 56px;

        flex-shrink: 0;

        border-radius: 50%;

        display: flex;
        align-items: center;
        justify-content: center;

        color: white;

        background: rgba(255, 255, 255, 0.035);

        border: 1px solid rgba(255, 255, 255, 0.18);

        cursor: pointer;

        transition: 0.2s ease;
      }

      .control:hover {
        background: rgba(255, 255, 255, 0.14);

        transform: scale(1.05);
      }

      .control.main {
        width: 72px;
        height: 72px;

        border: 1px solid rgba(255, 255, 255, 0.75);

        box-shadow:
          0 0 20px rgba(255, 255, 255, 0.15),
          inset 0 0 20px rgba(255, 255, 255, 0.06);
      }

      .control svg {
        width: 22px;
        height: 22px;
      }

      .control.main svg {
        width: 28px;
        height: 28px;
      }

      /* =========================
   TIMELINE
========================= */

      .timeline {
        flex: 1;

        display: flex;
        align-items: center;
        gap: 12px;

        min-width: 180px;
      }

      .time {
        color: #d2d2d2;
        font-size: 13px;
        white-space: nowrap;
      }

      .progress {
        flex: 1;

        height: 4px;

        appearance: none;
        -webkit-appearance: none;

        border-radius: 10px;

        background: linear-gradient(
          to right,
          white 0%,
          white 27%,
          rgba(255, 255, 255, 0.22) 27%,
          rgba(255, 255, 255, 0.22) 100%
        );

        cursor: pointer;
      }

      .progress::-webkit-slider-thumb {
        appearance: none;

        width: 13px;
        height: 13px;

        border-radius: 50%;

        background: white;

        box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      }

      .progress::-moz-range-thumb {
        width: 13px;
        height: 13px;

        border: none;

        border-radius: 50%;

        background: white;
      }

      /* =========================
   TBSM + WALLPAPER
========================= */

      .action {
        height: 58px;

        padding: 0 20px;

        border-radius: 30px;

        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;

        color: white;

        background: rgba(255, 255, 255, 0.06);

        border: 1px solid rgba(255, 255, 255, 0.17);

        backdrop-filter: blur(22px);
        -webkit-backdrop-filter: blur(22px);

        cursor: pointer;

        transition: 0.2s ease;
      }

      .action:hover {
        background: rgba(255, 255, 255, 0.14);
      }

      .action svg {
        width: 24px;
        height: 24px;
      }

      /* =========================
   LIBRARY
========================= */

      .library {
        position: absolute;

        left: 50%;
        bottom: 32px;

        transform: translateX(-50%);

        width: min(940px, 70vw);
        height: 365px;

        display: flex;

        background: rgba(14, 14, 14, 0.55);

        border: 1px solid rgba(255, 255, 255, 0.16);

        border-radius: 27px;

        box-shadow:
          0 30px 80px rgba(0, 0, 0, 0.5),
          inset 0 1px rgba(255, 255, 255, 0.12);

        backdrop-filter: blur(30px) saturate(130%);
        -webkit-backdrop-filter: blur(30px) saturate(130%);

        overflow: hidden;

        z-index: 4;
      }

      /* DRAG HANDLE */

      .handle {
        position: absolute;

        top: 10px;
        left: 50%;

        transform: translateX(-50%);

        width: 48px;
        height: 5px;

        border-radius: 10px;

        background: rgba(255, 255, 255, 0.55);
      }

      /* =========================
   SIDEBAR
========================= */

      .categories {
        width: 260px;

        padding: 50px 18px 25px;

        border-right: 1px solid rgba(255, 255, 255, 0.12);
      }

      .category {
        width: 100%;

        height: 45px;

        display: flex;
        align-items: center;

        gap: 16px;

        padding: 0 18px;

        border-radius: 12px;

        color: #ddd;

        font-size: 15px;

        cursor: pointer;

        transition: 0.2s ease;
      }

      .category:hover {
        background: rgba(255, 255, 255, 0.08);
      }

      .category.active {
        background: rgba(255, 255, 255, 0.14);

        color: white;
      }

      .category svg {
        width: 20px;
        height: 20px;
      }

      /* =========================
   SONG LIST
========================= */

      .songs {
        flex: 1;

        padding: 58px 20px 20px;

        overflow-y: auto;
      }

      .song {
        height: 62px;

        display: flex;
        align-items: center;

        padding: 6px 14px;

        border-radius: 12px;

        cursor: pointer;

        transition: 0.2s ease;
      }

      .song:hover {
        background: rgba(255, 255, 255, 0.08);
      }

      .song.active {
        background: rgba(255, 255, 255, 0.12);
      }

      .cover {
        width: 48px;
        height: 48px;

        flex-shrink: 0;

        border-radius: 8px;

        background: linear-gradient(135deg, #333, #080808);

        display: flex;
        align-items: center;
        justify-content: center;

        overflow: hidden;

        border: 1px solid rgba(255, 255, 255, 0.12);
      }

      .cover img {
        width: 100%;
        height: 100%;

        object-fit: cover;
      }

      .song-info {
        margin-left: 16px;

        min-width: 0;
      }

      .song-name {
        font-size: 15px;

        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .artist {
        margin-top: 5px;

        color: #999;

        font-size: 13px;
      }

      .duration {
        margin-left: auto;

        color: #bbb;

        font-size: 13px;
      }

      .more {
        width: 25px;

        margin-left: 18px;

        color: #aaa;

        font-size: 21px;

        text-align: center;
      }

      /* =========================
   FLOATING BUTTONS
========================= */

      .wallpaper {
        position: absolute;

        left: 22px;
        bottom: 22px;

        height: 62px;

        padding: 0 22px;

        display: flex;
        align-items: center;
        gap: 12px;

        border-radius: 25px;

        color: white;

        background: rgba(20, 20, 20, 0.48);

        border: 1px solid rgba(255, 255, 255, 0.18);

        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);

        cursor: pointer;
      }

      .signature {
        position: absolute;

        right: 22px;
        bottom: 22px;

        height: 55px;

        padding: 0 24px;

        display: flex;
        align-items: center;

        border-radius: 30px;

        color: white;

        font-family: cursive;

        background: rgba(20, 20, 20, 0.48);

        border: 1px solid rgba(255, 255, 255, 0.16);

        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
      }

      /* =========================
   RESPONSIVE
========================= */

      @media (max-width: 900px) {
        .address {
          width: 300px;
        }

        .player {
          width: 92vw;
        }

        .library {
          width: 92vw;
        }

        .categories {
          width: 210px;
        }

        .wallpaper {
          display: none;
        }
      }

      @media (max-width: 650px) {
        .browser {
          height: 50px;
        }

        .browser-left {
          gap: 15px;
          font-size: 18px;
        }

        .address {
          width: 180px;
          font-size: 11px;
        }

        .browser-right {
          gap: 12px;
        }

        .player {
          top: 58%;

          height: 78px;

          padding: 0 12px;

          gap: 8px;

          border-radius: 22px;
        }

        .control {
          width: 42px;
          height: 42px;
        }

        .control.main {
          width: 56px;
          height: 56px;
        }

        .timeline {
          gap: 5px;
        }

        .time {
          display: none;
        }

        .action {
          width: 45px;
          padding: 0;
        }

        .action span {
          display: none;
        }

        .library {
          height: 330px;

          bottom: 20px;
        }

        .categories {
          width: 120px;

          padding: 45px 8px 10px;
        }

        .category {
          padding: 0 10px;

          gap: 8px;

          font-size: 12px;
        }

        .category svg {
          width: 16px;
          height: 16px;
        }

        .songs {
          padding: 50px 8px 10px;
        }

        .song {
          padding: 5px;

          height: 58px;
        }

        .cover {
          width: 42px;
          height: 42px;
        }

        .song-info {
          margin-left: 8px;
        }

        .song-name {
          font-size: 12px;
        }

        .artist {
          font-size: 10px;
        }

        .duration {
          font-size: 10px;
        }

        .signature {
          display: none;
        }
      }
    </style>
  </head>

  <body>
    <div class="background"></div>

    <!-- Browser-style top bar -->
    <header class="browser">
      <div class="browser-left">
        <span>‹</span>
        <span>›</span>
        <span>↻</span>
        <span>⌂</span>

      <div class="address">
        <span>🔒 &nbsp; seedhemaut.vercel.app</span>
      </div>

      <div class="browser-right">
        <span>◐</span>
        <span>−</span>
        <span>□</span>
        <span>×</span>
      </div>
    </header>

    <!-- MUSIC PLAYER -->

    <div class="player">
      <button class="control" id="previous">
        <svg
          viewBox="0 0 24 24"

      <button class="control main" id="play">
        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M8 5v14l11-7z" />

      </button>

      <button class="control" id="next">
        <svg

        </svg>
      </button>

      <div class="timeline">
        <span class="time">0:47</span>

        <input class="progress" type="range" min="0" max="100" value="27" />

        <span class="time">3:11</span>
      </div>

      <button class="action">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <rect x="3" y="5" width="18" height="14" rx="2" />
          <path d="M5 16l4-4 3 3 3-4 4 5" />
        </svg>
      </button>

      <button class="action">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"

        >

          <path d="M15 7v10" />
          <path d="M19 10v4" />

        <span>TBSM<br />Audio</span>
      </button>

      <button class="action">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M3 6h18" />
          <path d="M5 6v14h14V6" />
          <path d="M9 3h6" />
        </svg>
      </button>
    </div>

    <!-- LIBRARY -->

    <section class="library">
      <div class="handle"></div>

      <aside class="categories">
        <div class="category active">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M9 18V5l12-2v13" />
            <circle cx="6" cy="18" r="3" />
            <circle cx="18" cy="16" r="3" />
          </svg>
          <span>All Songs</span>
        </div>

        <div class="category">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="9" />
            <circle cx="9" cy="10" r="1" />
            <circle cx="15" cy="10" r="1" />
            <path d="M8 15c2 2 6 2 8 0" />
          </svg>
          <span>Moods</span>
        </div>

        <div class="category">
          <span>♕</span>
          <span>Chill</span>
        </div>

        <div class="category">
          <span>♨</span>
          <span>Hype</span>
        </div>

        <div class="category">
          <span>☹</span>
          <span>Sad</span>
        </div>

        <div class="category">
          <span>☾</span>
          <span>Dark</span>
        </div>

        <div class="category">
          <span>ϟ</span>
          <span>Motivation</span>
        </div>
      </aside>

      <div class="songs">
        <div class="song active">
          <div class="cover">
            <img src="/ChatGPT Image Aug 13, 2026, 11_34_53 PM.png" />
          </div>

          <div class="song-info">
            <div class="song-name">Namastute</div>
            <div class="artist">Seedhe Maut</div>
          </div>

          <div class="duration">2:48</div>

          <div class="more">⋮</div>
        </div>

        <div class="song">
          <div class="cover">
            <img src="/ChatGPT Image Aug 13, 2026, 11_34_53 PM.png" />
          </div>

          <div class="song-info">
            <div class="song-name">11K</div>
            <div class="artist">Seedhe Maut</div>
          </div>

          <div class="duration">2:48</div>

          <div class="more">⋮</div>
        </div>

        <div class="song">
          <div class="cover">
            <img src="/ChatGPT Image Aug 13, 2026, 11_34_53 PM.png" />
          </div>

          <div class="song-info">
            <div class="song-name">Shaktimaan</div>
            <div class="artist">Seedhe Maut</div>
          </div>

          <div class="duration">2:57</div>

          <div class="more">⋮</div>
        </div>

        <div class="song">
          <div class="cover">
            <img src="/ChatGPT Image Aug 13, 2026, 11_34_53 PM.png" />
          </div>

          <div class="song-info">
            <div class="song-name">Khatam Hue Waande</div>
            <div class="artist">Seedhe Maut</div>
          </div>

          <div class="duration">3:36</div>

          <div class="more">⋮</div>
        </div>

        <div class="song">
          <div class="cover">
            <img src="/ChatGPT Image Aug 13, 2026, 11_34_53 PM.png" />
          </div>

          <div class="song-info">
            <div class="song-name">Kyu</div>
            <div class="artist">Seedhe Maut</div>
          </div>

          <div class="duration">3:07</div>

          <div class="more">⋮</div>
        </div>
      </div>
    </section>

    <!-- WALLPAPER BUTTON -->

    <button class="wallpaper">
      <svg
        width="23"
        height="23"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <rect x="3" y="3" width="18" height="18" rx="2" />
        <circle cx="8.5" cy="8.5" r="1.5" />
        <path d="M21 15l-5-5L5 21" />
      </svg>

      <span>Wallpaper<br />Change</span>
    </button>

    <!-- SIGNATURE -->

    <div class="signature">Tera Bhai Seedhe Maut</div>

    <script>
      const playButton = document.getElementById("play");
      const playIcon = document.getElementById("playIcon");

      let playing = false;

      playButton.addEventListener("click", () => {
        playing = !playing;

        if (playing) {
          playIcon.innerHTML = `
            <rect x="7" y="5" width="4" height="14"/>
            <rect x="13" y="5" width="4" height="14"/>
        `;
        } else {
          playIcon.innerHTML = `
            <path d="M8 5v14l11-7z"/>
        `;
        }
      });

      /* Song selection */

      const songs = document.querySelectorAll(".song");

      songs.forEach((song) => {
        song.addEventListener("click", () => {
          songs.forEach((item) => {
            item.classList.remove("active");
          });

          song.classList.add("active");
        });
      });

      /* Category selection */

      const categories = document.querySelectorAll(".category");

      categories.forEach((category) => {
        category.addEventListener("click", () => {
          categories.forEach((item) => {
            item.classList.remove("active");
          });

          category.classList.add("active");
        });
      });
    </script>
  </body>
</html>
