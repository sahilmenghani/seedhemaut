      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.35) 0%,
          rgba(0, 0, 0, 0.55) 60%,
          rgba(0, 0, 0, 0.75) 100%
        );
        z-index: 0;
        pointer-events: none;
      }

      .site-title {
        position: relative;
        z-index: 1;
        text-align: center;
        padding: 48px 20px 20px;
        font-size: 2.4rem;
        font-weight: 800;
        letter-spacing: 1px;
        text-shadow: 0 4px 18px rgba(0, 0, 0, 0.6);
      }

      .socials {
        position: relative;
        z-index: 1;
        display: flex;
        justify-content: center;
        gap: 14px;
        padding-bottom: 40px;
      }
      .social-btn {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.35),
          rgba(255, 255, 255, 0.12)
        );
        backdrop-filter: blur(14px) saturate(160%);
        -webkit-backdrop-filter: blur(14px) saturate(160%);
        border: 1px solid rgba(255, 255, 255, 0.45);
        color: #fff;
        text-decoration: none;
        transition: transform 0.15s ease;
      }
      .social-btn:hover {
        transform: translateY(-2px);
      }
      .social-btn svg {
        width: 20px;
        height: 20px;
      }

      /* ---------- Now Playing Pill ---------- */
      .player-wrap {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 18px;
        z-index: 50;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 0 12px;
        gap: 12px;
      }

      .player-pill {
        width: 100%;
        max-width: var(--pill-max-width);
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.55),
          rgba(255, 255, 255, 0.25)
        );
        backdrop-filter: blur(22px) saturate(180%);
        -webkit-backdrop-filter: blur(22px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.55);
        border-radius: 22px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        padding: 10px 14px 12px;
      }

      .player-top-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .art-wrap {
        position: relative;
        width: 60px;
        height: 60px;
        flex-shrink: 0;
      }
      .album-art {
        width: 60px;
        height: 60px;
        border-radius: 10px;
        object-fit: cover;
        background: #333;
        display: block;
        position: relative;
        z-index: 2;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      }
      .vinyl-disc {
        position: absolute;
        top: 50%;
        left: 38px;
        transform: translateY(-50%);
        width: 46px;
        height: 46px;
        border-radius: 50%;
        background: repeating-radial-gradient(
          circle at center,
          #1a1a1a 0px,
          #1a1a1a 2px,
          #2b2b2b 2px,
          #2b2b2b 4px
        );
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
        z-index: 1;
        animation: spin 3s linear infinite;
        animation-play-state: paused;
      }
      .vinyl-disc::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 14px;
        height: 14px;
        background: #c0392b;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        box-shadow: inset 0 0 0 2px #1a1a1a;
      }
      .vinyl-disc.spinning {
        animation-play-state: running;
      }

      @keyframes spin {
        from {
          transform: translateY(-50%) rotate(0deg);
        }
        to {
          transform: translateY(-50%) rotate(360deg);
        }
      }

      .track-title {
        flex: 1;
        min-width: 0;
        font-weight: 700;
        font-size: 0.98rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: #1a1a1a;
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.2);
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
      }
      .ctrl-btn {
        background: none;
        border: none;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: #1a1a1a;
      }
      .ctrl-btn svg {
        width: 22px;
        height: 22px;
      }

      .play-btn {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: #fff;
        color: #000;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      }
      .play-btn svg {
        width: 18px;
        height: 18px;
      }

      .bottom-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
        width: 100%;
      }

      .progress-bar {
        flex: 1;
        height: 5px;
        background: rgba(0, 0, 0, 0.2);
        border-radius: 4px;
        cursor: pointer;
        position: relative;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        width: 0%;
        background: #1a1a1a;
        border-radius: 4px;
      }

      .time-display {
        font-size: 0.72rem;
        color: #1a1a1a;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
        opacity: 0.85;
      }

      .shuffle-btn {
        width: 46px;
        height: 46px;
        flex-shrink: 0;
        border-radius: 50%;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.55),
          rgba(255, 255, 255, 0.25)
        );
        backdrop-filter: blur(22px) saturate(180%);
        -webkit-backdrop-filter: blur(22px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.55);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: #1a1a1a;
        transition: background 0.2s ease;
      }
      .shuffle-btn svg {
        width: 20px;
        height: 20px;
      }
      .shuffle-btn.flash {
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.9),
          rgba(255, 255, 255, 0.6)
        );
      }
      /* Wallpaper video layer */
      #wallpaperVideo {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: -2;
        display: none;
        pointer-events: none;
      }

      /* Smooth wallpaper transition */
      body {
        transition: background-image 0.7s ease;
      }

      /* Dark overlay over wallpaper/video */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        z-index: -1;
        pointer-events: none;
      }
      .icon-btn {
        width: 46px;
        height: 46px;
        flex-shrink: 0;
        border-radius: 50%;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.55),
          rgba(255, 255, 255, 0.25)
        );
        backdrop-filter: blur(22px) saturate(180%);
        -webkit-backdrop-filter: blur(22px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.55);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: #1a1a1a;
        transition: background 0.2s ease;
      }
      .icon-btn svg {
        width: 20px;
        height: 20px;
      }
      .icon-btn.flash {
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.9),
          rgba(255, 255, 255, 0.6)
        );
      }

      #yt-player-container {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        top: -9999px;
        left: -9999px;
      }

      @media (max-width: 480px) {
        .site-title {
          font-size: 1.7rem;
          padding-top: 36px;
        }
        .player-wrap {
          bottom: 12px;
        }
        .art-wrap {
          width: 52px;
          height: 52px;
        }
        .album-art {
          width: 52px;
          height: 52px;
        }
        .vinyl-disc {
          width: 40px;
          height: 40px;
          left: 32px;
        }
        .track-title {
          font-size: 0.88rem;
        }
      }
    </style>
  </head>
  <body>
    <video id="wallpaperVideo" autoplay muted loop playsinline></video>
    <div class="site-title">Seedhe Maut</div>

    <div class="socials">
      <a
        class="social-btn"
        href="https://www.instagram.com/sahilmenghani69/"
        target="_blank"
        rel="noopener"
        aria-label="Instagram"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <rect x="2" y="2" width="20" height="20" rx="5" />
          <circle cx="12" cy="12" r="4" />
          <circle cx="17.5" cy="6.5" r="1" />
        </svg>
      </a>
      <a
        class="social-btn"
        href="https://open.spotify.com/artist/2oBG74gAocPMFv6Ij9ykdo?si=R9d9eFDZT9qS0s3YiQZ-tQ"
        target="_blank"
        rel="noopener"
        aria-label="Spotify"
      >
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.59 14.44c-.19.3-.58.4-.88.21-2.42-1.48-5.47-1.81-9.06-.99-.34.08-.68-.14-.76-.48-.08-.34.14-.68.48-.76 3.93-.9 7.29-.52 10 1.14.3.19.4.58.22.88zm1.22-2.72c-.24.38-.73.5-1.11.27-2.77-1.7-6.99-2.2-10.27-1.2-.43.13-.88-.11-1-.53-.13-.43.11-.88.53-1 3.75-1.14 8.41-.58 11.58 1.36.38.23.5.73.27 1.1zm.11-2.83C14.6 8.85 9.5 8.68 6.53 9.6c-.51.16-1.05-.13-1.2-.64-.16-.51.13-1.05.64-1.2 3.42-1.04 9.08-.85 12.66 1.3.46.28.6.87.33 1.33-.28.46-.87.6-1.33.33z"
          />
        </svg>
      </a>
      <a
        class="social-btn"
        href="https://www.seedhemaut.com"
        target="_blank"
        rel="noopener"
        aria-label="Website"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="12" cy="12" r="10" />
          <path d="M2 12h20M12 2a15 15 0 010 20M12 2a15 15 0 000 20" />
        </svg>
      </a>
    </div>

    <div id="yt-player-container"><div id="yt-player"></div></div>

    <div class="player-wrap">
      <div class="player-pill">
        <div class="player-top-row">
          <div class="art-wrap">
            <div class="vinyl-disc" id="vinylDisc"></div>
            <img class="album-art" id="albumArt" src="" alt="Album art" />
          </div>
          <div class="track-title" id="trackTitle">Loading…</div>
          <div class="controls">
            <button class="ctrl-btn" id="prevBtn" aria-label="Previous">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M6 6h2v12H6zM20 6L10 12l10 6z" />
              </svg>
            </button>
            <button
              class="ctrl-btn play-btn"
              id="playBtn"
              aria-label="Play/Pause"
            >
              <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M8 5v14l11-7z" />
              </svg>
            </button>
            <button class="ctrl-btn" id="nextBtn" aria-label="Next">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M16 6h2v12h-2zM4 6l10 6-10 6z" />
              </svg>
            </button>
          </div>
        </div>
        <div class="bottom-row">
          <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <div class="time-display" id="timeDisplay">0:00 / 0:00</div>
        </div>
      </div>
      <button class="shuffle-btn" id="shuffleBtn" aria-label="Shuffle">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="16 3 21 3 21 8" />
          <line x1="4" y1="20" x2="21" y2="3" />
          <polyline points="21 16 21 21 16 21" />
          <line x1="15" y1="15" x2="21" y2="21" />
          <line x1="4" y1="4" x2="9" y2="9" />
        </svg>
      </button>
      <button class="icon-btn" id="wallpaperBtn" aria-label="Change wallpaper">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="3" y="3" width="18" height="18" rx="2" />
          <circle cx="8.5" cy="8.5" r="1.5" />
          <polyline points="21 15 16 10 5 21" />
        </svg>
      </button>
      <button class="icon-btn" id="tbsmAudioBtn" aria-label="Play TBSM audio">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
          <path d="M15.54 8.46a5 5 0 010 7.07" />
          <path d="M19.07 4.93a10 10 0 010 14.14" />
        </svg>
      </button>
      <audio id="tbsmAudio" preload="none"></audio>
    </div>

    <script>
      const PLAYLIST_ID = "PL6Z5nmGOBNaB5M2YKMaVfMlrzwqGVZecK";

      let player;
      let playerReady = false;
      let audioUnlocked = false;
      let progressInterval = null;
      let currentVideoId = null;

      // Load YouTube IFrame API
      const tag = document.createElement("script");
      tag.src = "https://www.youtube.com/iframe_api";
      document.head.appendChild(tag);

      function onYouTubeIframeAPIReady() {
        player = new YT.Player("yt-player", {
          height: "1",
          width: "1",
          playerVars: {
            listType: "playlist",
            list: PLAYLIST_ID,
            autoplay: 1,
            mute: 1,
            controls: 0,
            playsinline: 1,
          },
          events: {
            onReady: onPlayerReady,
            onStateChange: onPlayerStateChange,
          },
        });
      }
      window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;

      function onPlayerReady(event) {
        playerReady = true;
        event.target.mute();
        event.target.playVideo();
        updateNowPlayingInfo();
        startProgressLoop();
      }

      function onPlayerStateChange(event) {
        const state = event.data;
        if (state === YT.PlayerState.PLAYING) {
          setPlayingUI(true);
          updateNowPlayingInfo();
        } else if (state === YT.PlayerState.PAUSED) {
          setPlayingUI(false);
        } else if (state === YT.PlayerState.ENDED) {
          player.nextVideo();
        } else if (state === YT.PlayerState.CUED) {
          updateNowPlayingInfo();
        }
      }

      function setPlayingUI(isPlaying) {
        const playIcon = document.getElementById("playIcon");
        const disc = document.getElementById("vinylDisc");
        if (isPlaying) {
          playIcon.innerHTML =
            '<rect x="6" y="5" width="4" height="14"></rect><rect x="14" y="5" width="4" height="14"></rect>';
          disc.classList.add("spinning");
        } else {
          playIcon.innerHTML = '<path d="M8 5v14l11-7z"></path>';
          disc.classList.remove("spinning");
        }
      }

      function updateNowPlayingInfo() {
        if (!playerReady) return;
        try {
          const data = player.getVideoData();
          if (data && data.video_id) {
            currentVideoId = data.video_id;
            document.getElementById("trackTitle").textContent =
              data.title || "Loading…";
            document.getElementById("albumArt").src =
              `https://img.youtube.com/vi/${data.video_id}/mqdefault.jpg`;
          }
        } catch (e) {}
      }

      function formatTime(sec) {
        if (!sec || isNaN(sec)) return "0:00";
        sec = Math.floor(sec);
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        return `${m}:${s.toString().padStart(2, "0")}`;
      }

      function startProgressLoop() {
        if (progressInterval) clearInterval(progressInterval);
        progressInterval = setInterval(() => {
          if (!playerReady) return;
          try {
            const dur = player.getDuration();
            const cur = player.getCurrentTime();
            if (dur > 0) {
              const pct = (cur / dur) * 100;
              document.getElementById("progressFill").style.width = pct + "%";
            }
            document.getElementById("timeDisplay").textContent =
              `${formatTime(cur)} / ${formatTime(dur)}`;
            // catch title updates in case metadata loads late
            const data = player.getVideoData();
            if (data && data.video_id && data.video_id !== currentVideoId) {
              updateNowPlayingInfo();
            } else if (
              data &&
              data.title &&
              document.getElementById("trackTitle").textContent === "Loading…"
            ) {
              updateNowPlayingInfo();
            }
          } catch (e) {}
        }, 500);
      }

      // Controls
      document.getElementById("playBtn").addEventListener("click", () => {
        if (!playerReady) return;
        const state = player.getPlayerState();
        if (state === YT.PlayerState.PLAYING) {
          player.pauseVideo();
        } else {
          player.playVideo();
        }
      });

      document.getElementById("prevBtn").addEventListener("click", () => {
        if (!playerReady) return;
        player.previousVideo();
      });

      document.getElementById("nextBtn").addEventListener("click", () => {
        if (!playerReady) return;
        player.nextVideo();
      });

      document.getElementById("progressBar").addEventListener("click", (e) => {
        if (!playerReady) return;
        const bar = e.currentTarget;
        const rect = bar.getBoundingClientRect();
        const pct = (e.clientX - rect.left) / rect.width;
        const dur = player.getDuration();
        if (dur > 0) {
          player.seekTo(dur * pct, true);
        }
      });

      document.getElementById("shuffleBtn").addEventListener("click", (e) => {
        if (!playerReady) return;
        const btn = e.currentTarget;
        btn.classList.add("flash");
        setTimeout(() => btn.classList.remove("flash"), 250);

        try {
          const playlist = player.getPlaylist();
          if (playlist && playlist.length > 1) {
            const currentIndex = player.getPlaylistIndex();
            let randomIndex;
            do {
              randomIndex = Math.floor(Math.random() * playlist.length);
            } while (randomIndex === currentIndex);
            player.playVideoAt(randomIndex);
          } else {
            player.nextVideo();
          }
        } catch (err) {
          player.nextVideo();
        }
      });

      // Unlock audio on first interaction anywhere on the page
      function unlockAudio() {
        if (audioUnlocked || !playerReady) return;
        audioUnlocked = true;
        player.unMute();
        player.setVolume(100);
        document.removeEventListener("click", unlockAudio);
        document.removeEventListener("touchstart", unlockAudio);
      }
      document.addEventListener("click", unlockAudio);
      document.addEventListener("touchstart", unlockAudio);

      // ================================================================
      // WALLPAPERS — ADD YOUR OWN IMAGES / GIFS HERE
      // ================================================================
      // How to add a wallpaper:
      // 1. Go to a free "image to base64" converter website, for example:
      //    https://www.base64-image.de/  (works for images AND gifs)
      // 2. Upload your picture or gif there. It will give you a long block
      //    of text starting with something like:
      //       data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD......
      //    or for a gif:
      //       data:image/gif;base64,R0lGODlhAQABAIAAAP.......
      // 3. Copy that ENTIRE text (it can be very long, that's normal).
      // 4. Paste it as a new line inside the WALLPAPERS list below,
      //    with a comma at the end, wrapped in quotes, like this:
      //
      //    const WALLPAPERS = [
      //      "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD......",   <-- existing background
      //      "data:image/jpeg;base64,PASTE_YOUR_NEW_ONE_HERE......",      <-- your new wallpaper
      //      "data:image/gif;base64,PASTE_A_GIF_HERE......",              <-- a gif works too
      //    ];
      //
      // 5. Save the file and re-upload it to Netlify (or drag a fresh
      //    index.html onto app.netlify.com/drop again) to go live.
      //
      // The very first item in the list is what shows when the page loads.
      // Every time someone clicks the picture-frame button, it moves to
      // the next item in the list, and loops back to the first after the
      // last one.
      // ================================================================
      const WALLPAPERS = [
        {
          type: "image",
          src: "/1.png",
        },
        {
          type: "image",
          src: "/2.jpg",
        },
        {
          type: "image",
          src: "/3.jpg",
        },
        {
          type: "image",
          src: "/4.jpg",
        },

        // Example video wallpaper
        {
          type: "image",
          src: "/5.jpg",
        },
      ];

      let wallpaperIndex = 0;
      const wallpaperBtn = document.getElementById("wallpaperBtn");
      const wallpaperVideo = document.getElementById("wallpaperVideo");

      function changeWallpaper() {
        wallpaperIndex++;

        // Go back to first wallpaper after the last one
        if (wallpaperIndex >= WALLPAPERS.length) {
          wallpaperIndex = 0;
        }

        const wallpaper = WALLPAPERS[wallpaperIndex];

        // Image wallpaper
        if (wallpaper.type === "image") {
          wallpaperVideo.pause();
          wallpaperVideo.style.display = "none";

          document.body.style.backgroundImage = `url("${wallpaper.src}")`;

          document.body.style.backgroundSize = "cover";
          document.body.style.backgroundPosition = "center";
          document.body.style.backgroundRepeat = "no-repeat";
          document.body.style.backgroundAttachment = "fixed";
        }

        // Video wallpaper
        else if (wallpaper.type === "video") {
          document.body.style.backgroundImage = "none";

          wallpaperVideo.src = wallpaper.src;
          wallpaperVideo.style.display = "block";

          wallpaperVideo.currentTime = 0;
          wallpaperVideo.play().catch(() => {});
        }
      }

      wallpaperBtn.addEventListener("click", (e) => {
        const btn = e.currentTarget;

        btn.classList.add("flash");

        setTimeout(() => {
          btn.classList.remove("flash");
        }, 250);

        changeWallpaper();
      });

      // ================================================================
      // TBSM AUDIO — ADD YOUR AUDIO FILE HERE (once you have it)
      // ================================================================
      // How to add the audio:
      // 1. Go to a free "audio to base64" converter website, for example:
      //    https://base64.guru/converter/encode/audio
      // 2. Upload your mp3 file there. It will give you a long block of
      //    text starting with something like:
      //       data:audio/mpeg;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAAA......
      // 3. Copy that ENTIRE text.
      // 4. Paste it below, replacing the empty quotes "" , like this:
      //
      //    const TBSM_AUDIO_SRC = "data:audio/mpeg;base64,SUQzBAAAAAAA......";
      //
      // 5. Save and re-upload to Netlify to go live. The button will then
      //    play your audio each time it's clicked (and pause if clicked
      //    again while playing).
      // ================================================================
      const TBSM_AUDIO_SRC = ""; // 👈 paste your base64 audio here, inside the quotes

      const tbsmAudioEl = document.getElementById("tbsmAudio");
      if (TBSM_AUDIO_SRC) {
        tbsmAudioEl.src = TBSM_AUDIO_SRC;
      }

      document.getElementById("tbsmAudioBtn").addEventListener("click", (e) => {
        const btn = e.currentTarget;
        btn.classList.add("flash");
        setTimeout(() => btn.classList.remove("flash"), 250);

        if (!TBSM_AUDIO_SRC) {
          console.log(
            "No TBSM audio added yet — see the TBSM_AUDIO_SRC instructions in the code.",
          );
          return;
        }
        if (tbsmAudioEl.paused) {
          tbsmAudioEl.currentTime = 0;
          tbsmAudioEl.play();
        } else {
          tbsmAudioEl.pause();
        }
      });
    </script>
  </body>
</html>
