<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seedhe Maut</title>
    <link rel="icon" type="image/png" href="/seedhemautlogo.jpg" />
  </head>
  <link rel="stylesheet" href="/style.css" />

  <body>
    <!-- ================================================================
     MUSIC LIBRARY
================================================================ -->

    <button id="libraryBtn" class="library-btn">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path d="M9 18V5l12-2v13" />
        <circle cx="6" cy="18" r="3" />
        <circle cx="18" cy="16" r="3" />
      </svg>

      <span>Library</span>
    </button>

    <div id="libraryOverlay" class="library-overlay"></div>

    <section id="musicLibrary" class="music-library">
      <!-- Top handle -->
      <div class="library-handle"></div>

      <!-- Header -->
      <div class="library-header">
        <div>
          <div class="library-label">MUSIC LIBRARY</div>
          <h2>Your Music</h2>
        </div>

        <button id="libraryClose" class="library-close">×</button>
      </div>

      <div class="library-content">
        <!-- ============================================================
         LEFT SIDE — ALBUMS
    ============================================================ -->

        <aside class="library-sidebar">
          <div class="sidebar-title">ALBUMS</div>

          <div id="albumList" class="album-list"></div>
        </aside>

        <!-- ============================================================
         RIGHT SIDE — SONGS
    ============================================================ -->

        <div class="library-songs">
          <div class="songs-header">
            <div>
              <div class="library-label">NOW BROWSING</div>
              <h3 id="libraryAlbumName">Lunch Break</h3>
            </div>
          </div>

          <div id="librarySongList" class="library-song-list">
            <div class="library-empty">Select an album</div>
          </div>
        </div>
      </div>
    </section>
    <div class="live-status">
      <span id="currentTime">8:20 PM</span>
    </div>
    <video id="wallpaperVideo" autoplay muted loop playsinline></video>
    <div class="site-title">Seedhe Maut</div>

    <div class="socials">
      <a
        class="social-btn"
        href="https://www.instagram.com/sahilmenghani69/"
        target="_blank"
        rel="noopener"
        aria-label="Instagram"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <rect x="2" y="2" width="20" height="20" rx="5" />
          <circle cx="12" cy="12" r="4" />
          <circle cx="17.5" cy="6.5" r="1" />
        </svg>
      </a>
      <a
        class="social-btn"
        href="https://open.spotify.com/artist/2oBG74gAocPMFv6Ij9ykdo?si=R9d9eFDZT9qS0s3YiQZ-tQ"
        target="_blank"
        rel="noopener"
        aria-label="Spotify"
      >
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.59 14.44c-.19.3-.58.4-.88.21-2.42-1.48-5.47-1.81-9.06-.99-.34.08-.68-.14-.76-.48-.08-.34.14-.68.48-.76 3.93-.9 7.29-.52 10 1.14.3.19.4.58.22.88zm1.22-2.72c-.24.38-.73.5-1.11.27-2.77-1.7-6.99-2.2-10.27-1.2-.43.13-.88-.11-1-.53-.13-.43.11-.88.53-1 3.75-1.14 8.41-.58 11.58 1.36.38.23.5.73.27 1.1zm.11-2.83C14.6 8.85 9.5 8.68 6.53 9.6c-.51.16-1.05-.13-1.2-.64-.16-.51.13-1.05.64-1.2 3.42-1.04 9.08-.85 12.66 1.3.46.28.6.87.33 1.33-.28.46-.87.6-1.33.33z"
          />
        </svg>
      </a>
      <a
        class="social-btn"
        href="https://www.seedhemaut.com"
        target="_blank"
        rel="noopener"
        aria-label="Website"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="12" cy="12" r="10" />
          <path d="M2 12h20M12 2a15 15 0 010 20M12 2a15 15 0 000 20" />
        </svg>
      </a>
    </div>

    <div id="yt-player-container"><div id="yt-player"></div></div>

    <div class="player-wrap">
      <div class="player-pill">
        <div class="player-top-row">
          <div class="art-wrap">
            <div class="vinyl-disc" id="vinylDisc"></div>
            <img class="album-art" id="albumArt" src="" alt="Album art" />
          </div>
          <div class="track-title" id="trackTitle">Loading…</div>
          <div class="controls">
            <button class="ctrl-btn" id="prevBtn" aria-label="Previous">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M6 6h2v12H6zM20 6L10 12l10 6z" />
              </svg>
            </button>
            <button
              class="ctrl-btn play-btn"
              id="playBtn"
              aria-label="Play/Pause"
            >
              <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M8 5v14l11-7z" />
              </svg>
            </button>
            <button class="ctrl-btn" id="nextBtn" aria-label="Next">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M16 6h2v12h-2zM4 6l10 6-10 6z" />
              </svg>
            </button>
          </div>
        </div>
        <div class="bottom-row">
          <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <div class="time-display" id="timeDisplay">0:00 / 0:00</div>
        </div>
      </div>
      <button class="shuffle-btn" id="shuffleBtn" aria-label="Shuffle">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="16 3 21 3 21 8" />
          <line x1="4" y1="20" x2="21" y2="3" />
          <polyline points="21 16 21 21 16 21" />
          <line x1="15" y1="15" x2="21" y2="21" />
          <line x1="4" y1="4" x2="9" y2="9" />
        </svg>
      </button>
      <button class="icon-btn" id="wallpaperBtn" aria-label="Change wallpaper">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="3" y="3" width="18" height="18" rx="2" />
          <circle cx="8.5" cy="8.5" r="1.5" />
          <polyline points="21 15 16 10 5 21" />
        </svg>
      </button>
      <button class="icon-btn" id="tbsmAudioBtn" aria-label="Play TBSM audio">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
          <path d="M15.54 8.46a5 5 0 010 7.07" />
          <path d="M19.07 4.93a10 10 0 010 14.14" />
        </svg>
      </button>
      <audio id="tbsmAudio" preload="none"></audio>
    </div>

    <script src="script.js"></script>
  </body>
</html>
